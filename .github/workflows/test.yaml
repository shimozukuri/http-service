name: Tests

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v -race ./...


  functional-tests:
    name: Functional Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Prepare application
        run: mkdir -p storage

      - name: Start application
        env:
          CONFIG_PATH: ./config/prod.yaml
        run: |
          go run ./cmd/http-service > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if ! kill -0 $(cat app.pid) 2>/dev/null; then
              echo "Application process died"
              echo "=== APPLICATION LOGS ==="
              cat app.log
              exit 1
            fi

            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8082/health || true)

            echo "Attempt $i: HTTP status = $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "Application is ready"
              exit 0
            fi

            sleep 1
          done

          echo "Application did not become ready"
          echo "=== APPLICATION LOGS ==="
          cat app.log
          exit 1

      - name: Run functional tests
        run: go test -tags=functional -v -count=1 ./tests/...

      - name: Print application logs
        if: failure()
        run: cat app.log
