name: Tests

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v -race ./...


  functional-tests:
    name: Functional Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Prepare application
        run: mkdir -p storage

      - name: Start application
        env:
          CONFIG_PATH: ./config/ci.yaml
        run: |
          go run ./cmd/http-service > app.log 2>&1 &
          echo $! > app.pid

      - name: Debug application
        run: |
          echo "=== CONFIG ==="
          cat ./config/ci.yaml

          echo ""
          echo "=== PROCESSES ==="
          ps aux | grep -E "go|http-service" | grep -v grep || true

          echo ""
          echo "=== LISTENING PORTS ==="
          ss -ltnp || true

          echo ""
          echo "=== APPLICATION LOG ==="
          cat app.log || true

          echo ""
          echo "=== CURL ==="
          curl -v --connect-timeout 3 http://127.0.0.1:8082/health || true

      - name: Run functional tests
        run: go test -tags=functional -v -count=1 ./tests/...

      - name: Print application logs
        if: failure()
        run: cat app.log
